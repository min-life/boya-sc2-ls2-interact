const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);

const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
let timer=null,curAudio=null;
function sp(t){
  if(!('speechSynthesis' in window)){alert('Thiết bị này không hỗ trợ đọc tiếng Trung.');return}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';
  const v=speechSynthesis.getVoices().find(x=>/zh/i.test(x.lang));if(v)u.voice=v;
  u.rate=parseFloat(ls.get('rate',0.85));speechSynthesis.speak(u);return u;
}

/* ---------- generic quiz ---------- */
function quizRunner(items,host){
  let i=0,sc=0;const qs=sh(items);host=host||main;
  function show(){
    if(i>=qs.length){host.innerHTML=`<div class="card"><div class="score">${sc}/${qs.length}</div><p>${sc===qs.length?'Tuyệt vời! Bạn làm đúng hết.':'Làm lại để nhớ chắc hơn nhé.'}</p><button class="btn" id="again">Làm lại</button></div>`;host.querySelector('#again').onclick=()=>{i=0;sc=0;show()};return}
    const it=qs[i];const opts=sh(it.opts.map((o,j)=>[o,j===it.ans]));
    host.innerHTML=`<div class="bar"><i style="width:${i/qs.length*100}%"></i></div><div class="card"><p class="q">${it.q}</p><div class="hint">${it.hint||''}</div><div class="opts"></div><div class="fb" aria-live="polite"></div><div class="row"><button class="btn nx" hidden>Câu tiếp</button></div></div>`;
    const box=host.querySelector('.opts'),fb=host.querySelector('.fb'),nx=host.querySelector('.nx');
    opts.forEach(([t,ok])=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{
      box.querySelectorAll('button').forEach((x,n)=>{x.disabled=true;if(opts[n][1])x.classList.add('ok')});
      if(ok){sc++;fb.className='fb ok';fb.textContent='Đúng rồi! '+(it.exp||'')}else{b.classList.add('bad');fb.className='fb bad';fb.textContent='Chưa đúng. '+(it.exp||'')}
      nx.hidden=false;nx.focus();nx.onclick=()=>{i++;show()}};box.appendChild(b)});
  }show();
}

VIEWS.write=()=>{
  let dir='vi2zh',i=0,sc=0,d=sh(V),graded=false;
  function head(){return subnav([['vi2zh','Nhìn nghĩa → viết chữ Hán'],['zh2vi','Nhìn chữ Hán → viết nghĩa']],dir,k=>{dir=k;i=0;sc=0;d=sh(V);show()})}
  function show(){

    const inp=$('#in'),fb=$('#fb');inp.focus();
    function next(){i++;show()}
    function reveal(ok){fb.className='fb '+(ok?'ok':'bad');fb.innerHTML=(ok?'Đúng rồi! ':'Đáp án: ')+`<b>${v[0]}</b> · ${v[1]} · ${esc(v[2])}`;$('#nx').hidden=false;$('#nx').focus();$('#nx').onclick=next;$('#ck').disabled=true;
      if(!ok&&dir==='zh2vi'){const b=document.createElement('button');b.className='btn ghost mini';b.textContent='Mình viết đúng nghĩa rồi';b.onclick=()=>{if(!graded){sc++;graded=true;b.disabled=true}};fb.appendChild(document.createElement('br'));fb.appendChild(b)}
      if(ok)sc++}
    function check(){const a=inp.value.trim();if(!a)return;let ok;
      if(dir==='vi2zh')ok=a===v[0];
      else{const na=norm(a);ok=v[2].split(/[,;()]/).map(norm).filter(Boolean).some(x=>na===x||(x.length>3&&na.includes(x)))}
      reveal(ok)}
    $('#ck').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter'){$('#nx').hidden?check():next()}};

      L.forEach((v,n)=>{const r=document.createElement('div');r.className='vid';const a=document.createElement('a');a.href=v.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=v.title||v.url;const b=document.createElement('button');b.className='btn ghost mini';b.textContent='Xóa';b.onclick=()=>{L.splice(n,1);ls.set('videos',L);list()};r.append(a,b);$('#vl').appendChild(r)})}

    mr.ondataavailable=e=>chunks.push(e.data);
    mr.onstop=()=>{const blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});const au=card.querySelector('[data-au]');if(au.src)URL.revokeObjectURL(au.src);au.src=URL.createObjectURL(blob);
      card.querySelector('[data-a=rec]').textContent='● Ghi âm';card.querySelector('[data-a=rec]').classList.remove('rec');
      card.querySelector('[data-a=back]').disabled=false;card.querySelector('[data-a=redo]').disabled=false;card.querySelector('[data-st]').textContent='Đã ghi âm xong. Bấm Nghe lại để nghe.'};
    mr.start();const b=card.querySelector('[data-a=rec]');b.textContent='■ Dừng';b.classList.add('rec');card.querySelector('[data-st]').textContent='Đang ghi âm…';
  }
  $('#blocks').onclick=e=>{const b=e.target.closest('button');if(!b)return;const card=b.closest('.card'),a=b.dataset.a,i=+card.dataset.i;
    if(a==='play')sp(spk(R[i][0]));
    else if(a==='rec'){if(mr&&mr.state==='recording'&&active===card)stop();else start(card)}
    else if(a==='redo'){start(card)}
    else if(a==='back'){const au=card.querySelector('[data-au]');au.currentTime=0;au.play()}};
  window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop())});
};
VIEWS.tr=()=>{
  function blk(title,arr,dir){return `<h2>${title}</h2>`+arr.map((p,i)=>`<div class="card" data-d="${dir}"><p class="q">${i+1}. ${dir==='vz'?esc(p[0]):p[0]}</p><textarea aria-label="Bản dịch của bạn" placeholder="${dir==='vz'?'Viết bằng chữ Hán…':'Viết bằng tiếng Việt…'}" style="min-height:70px"></textarea><div class="row"><button class="btn ghost" data-s="1">Xem đáp án mẫu</button></div><div class="fb ok" hidden><b>${dir==='vz'?p[1]:esc(p[1])}</b></div></div>`).join('')}
  main.innerHTML=`<p class="hint">Tự dịch trước rồi mới xem đáp án mẫu. Đáp án mẫu chỉ là một cách dịch, nói khác nhưng đúng ngữ pháp vẫn được.</p>`+blk('Việt → Trung (5 câu)',TV,'vz')+blk('Trung → Việt (5 câu)',TZ,'zv');
  main.onclick=e=>{const b=e.target.closest('[data-s]');if(b){const f=b.closest('.card').querySelector('.fb');f.hidden=!f.hidden;b.textContent=f.hidden?'Xem đáp án mẫu':'Ẩn đáp án'}};
};
VIEWS.rc=()=>{
  main.innerHTML=`<div class="card"><h2 style="margin-top:0">小林的汉语</h2><div class="sent" style="line-height:1.9">${RC.zh}</div><div class="row"><button class="btn ghost" id="s">🔊 Nghe</button><button class="btn ghost" id="p">Pinyin</button><button class="btn ghost" id="v">Dịch</button></div><div class="pyl" id="pp" hidden>${RC.py}</div><div class="vi" id="vv" hidden>${RC.vi}</div></div><div id="qz"></div><div class="card"><p class="q">5. ${RC.open}</p><textarea id="oa" placeholder="Viết câu trả lời bằng tiếng Trung…"></textarea><div class="row"><button class="btn ghost" id="os">Xem câu trả lời mẫu</button></div><div class="fb ok" id="ob" hidden>${RC.sample}</div></div>`;
  $('#s').onclick=()=>sp(RC.zh.replace(/[“”]/g,''));$('#p').onclick=()=>{$('#pp').hidden=!$('#pp').hidden};$('#v').onclick=()=>{$('#vv').hidden=!$('#vv').hidden};$('#os').onclick=()=>{$('#ob').hidden=!$('#ob').hidden};
  quizRunner(RC.q.map(q=>({q:q[0],hint:'Chọn đáp án đúng theo bài đọc',opts:q[1],ans:q[2],exp:q[3]})),$('#qz'));
};
VIEWS.essay=()=>{
  const topic=ls.get('topic','我想搬家'),text=ls.get('essay',ESSAY);
  main.innerHTML=`<div class="card"><label for="tp"><b>Chủ đề</b> (bạn có thể sửa)</label><input type="text" id="tp" value="${esc(topic)}" style="margin-top:6px"><p class="hint" style="margin:10px 0 6px">Viết một đoạn văn ngắn khoảng 80–100 chữ Hán. Hãy dùng từ vựng và ngữ pháp của bài. Bài mẫu bên dưới là của mình, bạn sửa thoải mái.</p><textarea id="es" style="min-height:190px;font-size:19px">${esc(text)}</textarea><div class="row"><b id="cnt"></b><span class="hint" id="rg"></span></div><div class="row"><button class="btn ghost" id="smp">Chèn lại bài mẫu</button><button class="btn ghost" id="trs">Xem dịch bài mẫu</button><button class="btn ghost" id="lis">🔊 Nghe bài của bạn</button></div><div class="fb ok" id="tv" hidden>${ESSAY_VI}</div></div><div class="card"><h2 style="margin-top:0">Ngữ pháp đã dùng</h2><div id="gm"></div><h2>Từ vựng đã dùng <span id="vc" class="hint"></span></h2><div id="vm"></div></div>`;
  function upd(){const t=$('#es').value;const n=(t.match(/[\u4e00-\u9fff]/g)||[]).length;$('#cnt').textContent=n+' chữ Hán';
    const rg=$('#rg');if(n<80){rg.textContent='Còn thiếu '+(80-n)+' chữ để đủ 80'}else if(n>100){rg.textContent='Dư '+(n-100)+' chữ so với 100'}else{rg.textContent='Đạt yêu cầu 80–100 chữ ✓'}
    $('#gm').innerHTML=GRAM_MARK.map(([l,re])=>`<span class="tag ${new RegExp(re).test(t)?'on':''}">${l}</span>`).join('');
    const used=V.filter(v=>t.includes(v[0]));$('#vc').textContent=`(${used.length}/${V.length})`;
    $('#vm').innerHTML=V.map(v=>`<span class="tag ${t.includes(v[0])?'on':''}">${v[0]}</span>`).join('');
    ls.set('essay',t)}
  $('#es').oninput=upd;$('#tp').oninput=e=>ls.set('topic',e.target.value);
  $('#smp').onclick=()=>{if(confirm('Thay nội dung hiện tại bằng bài mẫu?')){$('#es').value=ESSAY;upd()}};
  $('#trs').onclick=()=>{$('#tv').hidden=!$('#tv').hidden};$('#lis').onclick=()=>sp($('#es').value);
  upd();
};
VIEWS.game=()=>{
  let g='mem';
  function show(){main.innerHTML='';main.appendChild(subnav([['mem','Ghép cặp'],['spd','Tốc độ 60 giây']],g,k=>{clearInterval(timer);g=k;show()}));const h=document.createElement('div');main.appendChild(h);(g==='mem'?memory:speed)(h)}
  function memory(h){
    const pairs=sh(V).slice(0,8),cards=sh(pairs.flatMap((p,i)=>[{id:i,t:p[0]},{id:i,t:p[2].split(/[,(]/)[0].trim()}]));
    let open=[],moves=0,done=0,lock=false;const best=ls.get('memBest',null);
    h.innerHTML=`<p class="hint">Ghép chữ Hán với nghĩa tiếng Việt. Ít lượt lật nhất là thắng.${best?` Kỷ lục: ${best} lượt.`:''}</p><div class="mem" id="mb"></div><p><b id="mv">0 lượt</b></p><div class="fb ok" id="mf" aria-live="polite"></div><button class="btn" id="mr">Chơi lại</button>`;
    const mb=h.querySelector('#mb');
    cards.forEach((c,n)=>{const b=document.createElement('button');b.setAttribute('aria-label','Thẻ '+(n+1));b.textContent='?';b.onclick=()=>{
      if(lock||b.classList.contains('up')||b.classList.contains('done'))return;b.classList.add('up');b.textContent=c.t;open.push([b,c]);
      if(open.length===2){moves++;h.querySelector('#mv').textContent=moves+' lượt';const [[b1,c1],[b2,c2]]=open;
        if(c1.id===c2.id&&b1!==b2){b1.classList.replace('up','done');b2.classList.replace('up','done');open=[];done++;
          if(done===8){const nb=!best||moves<best;if(nb)ls.set('memBest',moves);h.querySelector('#mf').textContent='Hoàn thành sau '+moves+' lượt!'+(nb?' Kỷ lục mới 🎉':'')}}
        else{lock=true;setTimeout(()=>{[b1,b2].forEach(x=>{x.classList.remove('up');x.textContent='?'});open=[];lock=false},800)}}};mb.appendChild(b)});
    h.querySelector('#mr').onclick=()=>memory(h);
  }
  function speed(h){
    let t=60,sc=0,streak=0,cur=null;const best=ls.get('spdBest',0);
    h.innerHTML=`<p class="hint">Chọn nghĩa đúng của chữ Hán. Trả lời đúng liên tiếp được thêm điểm. Kỷ lục: ${best}.</p><div class="card"><div class="row" style="justify-content:space-between;margin:0 0 8px"><b id="tm">60 giây</b><b id="sc">0 điểm</b></div><div id="qa"></div></div>`;
    function ask(){const v=sh(V)[0];const o=sh([v[2],...sh(V.filter(x=>x!==v)).slice(0,3).map(x=>x[2])]);cur=v;
      h.querySelector('#qa').innerHTML=`<div class="zh">${v[0]}</div><div class="opts"></div>`;const bx=h.querySelector('.opts');
      o.forEach(t=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{if(t===cur[2]){streak++;sc+=1+Math.min(streak-1,4)}else{streak=0;sc=Math.max(0,sc-1)}h.querySelector('#sc').textContent=sc+' điểm';ask()};bx.appendChild(b)})}
    ask();clearInterval(timer);
    timer=setInterval(()=>{t--;h.querySelector('#tm').textContent=t+' giây';if(t<=0){clearInterval(timer);const nb=sc>best;if(nb)ls.set('spdBest',sc);h.querySelector('#qa').innerHTML=`<div class="score">${sc} điểm</div><p>${nb?'Kỷ lục mới 🎉':'Cố gắng phá kỷ lục nhé.'}</p><button class="btn" id="ag">Chơi lại</button>`;h.querySelector('#ag').onclick=()=>speed(h)}},1000);
  }
  show();
};
$('#theme').onclick=()=>{const r=document.documentElement,d=matchMedia('(prefers-color-scheme:dark)').matches;const c=r.dataset.theme||(d?'dark':'light');r.dataset.theme=c==='dark'?'light':'dark'};
if('speechSynthesis' in window)speechSynthesis.getVoices();
{const h0=(location.hash||'').slice(1);go(VIEWS[h0]?h0:'cards');addEventListener('hashchange',()=>{const x=location.hash.slice(1);if(VIEWS[x])go(x)})}
</script></body></html>
